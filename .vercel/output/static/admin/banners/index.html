<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Banners | Future Media Admin</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet"><link rel="icon" type="image/png" href="/assets/logo.png"><script>(function(){const apiBase = "https://futurem.simplyfound.com.na";

      window.__API_BASE__ = apiBase;
    })();</script><script src="/admin/fm-admin.js"></script><link rel="stylesheet" href="/_astro/admin.DF6XE_WY.css"></head><body class="admin-body"><div class="admin-shell"><aside class="admin-sidebar"><div class="admin-sidebar__brand"><img src="/assets/logo.png" alt="Future Media"><span>Admin Panel</span></div><nav class="admin-nav"><a href="/admin/dashboard" class>Dashboard</a><a href="/admin/users" class>Users</a><a href="/admin/news" class>News</a><a href="/admin/events" class>Events</a><a href="/admin/gallery" class>Gallery</a><a href="/admin/vacancies" class>Vacancies</a><a href="/admin/applications" class>Applications</a><a href="/admin/contact" class>Contact Us</a><a href="/admin/subscriptions" class>Subscriptions</a><a href="/admin/banners" class="active">Banners</a></nav><div class="admin-sidebar__footer"><a href="/" style="color:rgba(255,255,255,0.7);text-decoration:none;">← View website</a></div></aside><div class="admin-main"><header class="admin-topbar"><h1>Banners</h1><div class="admin-user"><span id="admin-user-label">Loading…</span><button type="button" class="btn btn-ghost btn-sm" id="admin-logout">Logout</button></div></header><div class="admin-content"><div class="admin-card"><div class="admin-card__header"><h2>Landing page banners</h2><button type="button" class="btn btn-primary" id="btn-add">Add banner</button></div><div id="alert"></div><div class="table-wrap"><table class="admin-table"><thead><tr><th>Image</th><th>Title</th><th>Description</th><th>Active</th><th>Updated</th><th>Actions</th></tr></thead><tbody id="tbody"></tbody></table></div></div><div class="modal" id="modal" hidden><div class="modal__backdrop" data-close></div><div class="modal__panel"><h3 id="modal-title">Add banner</h3><form id="form"><input type="hidden" id="item-id"><div class="form-group" style="margin-bottom:12px;"><label>Title</label><input id="title" required></div><div class="form-group" style="margin-bottom:12px;"><label>Description</label><textarea id="desc" required></textarea></div><div class="form-group" style="margin-bottom:12px;"><label>Active</label><select id="active"><option value="true">Yes</option><option value="false">No</option></select></div><div class="form-group" style="margin-bottom:12px;"><label>Banner image</label><input type="file" id="image" accept="image/jpeg,image/png,image/webp,.jpg,.jpeg,.png,.webp"></div><div class="actions"><button type="button" class="btn btn-ghost" data-close>Cancel</button><button type="submit" class="btn btn-primary">Save</button></div></form></div></div><script>
    (async function () {
      const A = window.FMAdmin;
      if (!A.requireAuth()) return;
      const tbody = document.getElementById('tbody');
      const modal = document.getElementById('modal');
      const form = document.getElementById('form');
      const alertBox = document.getElementById('alert');
      const show = (m, ok) => alertBox.innerHTML = `<div class="alert ${ok?'alert-success':'alert-error'}">${A.esc(m)}</div>`;

      async function load() {
        const rows = (await A.api('/api/banners')).data || [];
        tbody.innerHTML = rows.map((b) => `
          <tr>
            <td><img class="thumb" src="${A.mediaUrl(b.imagePath)}" alt="" /></td>
            <td>${A.esc(b.title)}</td>
            <td style="max-width:260px;">${A.esc(b.description)}</td>
            <td>${b.active ? 'Yes' : 'No'}</td>
            <td>${A.formatDate(b.updatedDate || b.createdDate)}</td>
            <td class="actions">
              <button class="btn btn-ghost btn-sm" data-edit="${b.id}">Edit</button>
              <button class="btn btn-danger btn-sm" data-del="${b.id}">Delete</button>
            </td>
          </tr>`).join('') || '<tr><td colspan="6">No banners yet</td></tr>';
      }

      document.getElementById('btn-add').onclick = () => {
        form.reset(); document.getElementById('item-id').value='';
        document.getElementById('modal-title').textContent='Add banner';
        document.getElementById('image').required=true; modal.hidden=false;
      };
      modal.querySelectorAll('[data-close]').forEach((el)=>el.onclick=()=>modal.hidden=true);

      tbody.addEventListener('click', async (e) => {
        const t=e.target;
        try {
          if (t.dataset.edit) {
            const item=(await A.api(`/api/banners/${t.dataset.edit}`)).data;
            document.getElementById('item-id').value=item.id;
            document.getElementById('title').value=item.title;
            document.getElementById('desc').value=item.description;
            document.getElementById('active').value=String(item.active);
            document.getElementById('image').required=false;
            document.getElementById('modal-title').textContent='Update banner';
            modal.hidden=false;
          }
          if (t.dataset.del) {
            if (!confirm('Delete banner?')) return;
            await A.api(`/api/banners/${t.dataset.del}`, { method:'DELETE' });
            show('Banner deleted', true); load();
          }
        } catch (ex) { show(ex.message,false); }
      });

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const id=document.getElementById('item-id').value;
        const fd=new FormData();
        fd.append('title', document.getElementById('title').value);
        fd.append('description', document.getElementById('desc').value);
        if (id) fd.append('active', document.getElementById('active').value);
        const file=document.getElementById('image').files[0];
        if (file) fd.append('image', file);
        try {
          if (id) await A.api(`/api/banners/${id}`, { method:'PUT', body:fd });
          else await A.api('/api/banners', { method:'POST', body:fd });
          show(id?'Banner updated':'Banner created', true); modal.hidden=true; load();
        } catch (ex) { show(ex.message,false); }
      });

      await load();
    })();
  </script></div></div></div><script>
      (function () {
        if (!window.FMAdmin.requireAuth()) return;
        const user = window.FMAdmin.getUser();
        const label = document.getElementById('admin-user-label');
        if (label && user) label.textContent = user.fullName + ' · ' + user.role;
        document.getElementById('admin-logout')?.addEventListener('click', () => window.FMAdmin.logout());
      })();
    </script></body></html>
