<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Dashboard | Future Media Admin</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet"><link rel="icon" type="image/png" href="/assets/logo.png"><script>(function(){const apiBase = "https://futurem.simplyfound.com.na";

      window.__API_BASE__ = apiBase;
    })();</script><script src="/admin/fm-admin.js"></script><link rel="stylesheet" href="/_astro/admin.DF6XE_WY.css"></head><body class="admin-body"><div class="admin-shell"><aside class="admin-sidebar"><div class="admin-sidebar__brand"><img src="/assets/logo.png" alt="Future Media"><span>Admin Panel</span></div><nav class="admin-nav"><a href="/admin/dashboard" class="active">Dashboard</a><a href="/admin/users" class>Users</a><a href="/admin/news" class>News</a><a href="/admin/events" class>Events</a><a href="/admin/gallery" class>Gallery</a><a href="/admin/vacancies" class>Vacancies</a><a href="/admin/applications" class>Applications</a><a href="/admin/contact" class>Contact Us</a><a href="/admin/subscriptions" class>Subscriptions</a><a href="/admin/banners" class>Banners</a></nav><div class="admin-sidebar__footer"><a href="/" style="color:rgba(255,255,255,0.7);text-decoration:none;">← View website</a></div></aside><div class="admin-main"><header class="admin-topbar"><h1>Dashboard</h1><div class="admin-user"><span id="admin-user-label">Loading…</span><button type="button" class="btn btn-ghost btn-sm" id="admin-logout">Logout</button></div></header><div class="admin-content"><div class="stats-grid" id="stats-grid"><div class="stat-card"><div class="stat-card__label">News</div><div class="stat-card__value" id="s-news">—</div></div><div class="stat-card"><div class="stat-card__label">Pending News</div><div class="stat-card__value" id="s-pending">—</div></div><div class="stat-card"><div class="stat-card__label">Events</div><div class="stat-card__value" id="s-events">—</div></div><div class="stat-card"><div class="stat-card__label">Gallery</div><div class="stat-card__value" id="s-gallery">—</div></div><div class="stat-card"><div class="stat-card__label">Vacancies</div><div class="stat-card__value" id="s-vacancies">—</div></div><div class="stat-card"><div class="stat-card__label">Applications</div><div class="stat-card__value" id="s-apps">—</div></div><div class="stat-card"><div class="stat-card__label">Contacts</div><div class="stat-card__value" id="s-contact">—</div></div><div class="stat-card"><div class="stat-card__label">Subscribers</div><div class="stat-card__value" id="s-subs">—</div></div></div><div class="admin-card"><div class="admin-card__header"><h2>Quick actions</h2></div><div class="actions"><a class="btn btn-primary" href="/admin/news">Manage News</a><a class="btn btn-dark" href="/admin/events">Manage Events</a><a class="btn btn-ghost" href="/admin/banners">Update Banner</a><a class="btn btn-ghost" href="/admin/vacancies">Post Vacancy</a></div></div><script>
    (async function () {
      const A = window.FMAdmin;
      if (!A.requireAuth()) return;
      try {
        const [news, pending, events, gallery, vacancies, apps, contact, subs] = await Promise.all([
          A.api('/api/news'),
          A.api('/api/news/pending'),
          A.api('/api/events'),
          A.api('/api/gallery'),
          A.api('/api/vacancies'),
          A.api('/api/applications'),
          A.api('/api/contact'),
          A.api('/api/subscriptions'),
        ]);
        document.getElementById('s-news').textContent = (news.data || []).length;
        document.getElementById('s-pending').textContent = (pending.data || []).length;
        document.getElementById('s-events').textContent = (events.data || []).length;
        document.getElementById('s-gallery').textContent = (gallery.data || []).length;
        document.getElementById('s-vacancies').textContent = (vacancies.data || []).length;
        document.getElementById('s-apps').textContent = (apps.data || []).length;
        document.getElementById('s-contact').textContent = (contact.data || []).length;
        document.getElementById('s-subs').textContent = (subs.data || []).length;
      } catch (e) {
        console.error(e);
      }
    })();
  </script></div></div></div><script>
      (function () {
        if (!window.FMAdmin.requireAuth()) return;
        const user = window.FMAdmin.getUser();
        const label = document.getElementById('admin-user-label');
        if (label && user) label.textContent = user.fullName + ' · ' + user.role;
        document.getElementById('admin-logout')?.addEventListener('click', () => window.FMAdmin.logout());
      })();
    </script></body></html>
