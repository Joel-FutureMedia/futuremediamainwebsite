<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Gallery | Future Media Admin</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet"><link rel="icon" type="image/png" href="/assets/logo.png"><script>(function(){const apiBase = "https://futurem.simplyfound.com.na";

      window.__API_BASE__ = apiBase;
    })();</script><script src="/admin/fm-admin.js"></script><link rel="stylesheet" href="/_astro/admin.DF6XE_WY.css"></head><body class="admin-body"><div class="admin-shell"><aside class="admin-sidebar"><div class="admin-sidebar__brand"><img src="/assets/logo.png" alt="Future Media"><span>Admin Panel</span></div><nav class="admin-nav"><a href="/admin/dashboard" class>Dashboard</a><a href="/admin/users" class>Users</a><a href="/admin/news" class>News</a><a href="/admin/events" class>Events</a><a href="/admin/gallery" class="active">Gallery</a><a href="/admin/vacancies" class>Vacancies</a><a href="/admin/applications" class>Applications</a><a href="/admin/contact" class>Contact Us</a><a href="/admin/subscriptions" class>Subscriptions</a><a href="/admin/banners" class>Banners</a></nav><div class="admin-sidebar__footer"><a href="/" style="color:rgba(255,255,255,0.7);text-decoration:none;">← View website</a></div></aside><div class="admin-main"><header class="admin-topbar"><h1>Gallery</h1><div class="admin-user"><span id="admin-user-label">Loading…</span><button type="button" class="btn btn-ghost btn-sm" id="admin-logout">Logout</button></div></header><div class="admin-content"><div class="admin-card"><div class="admin-card__header"><h2>Gallery photos</h2><div class="actions"><button type="button" class="btn btn-ghost" id="btn-single">Upload single</button><button type="button" class="btn btn-primary" id="btn-multi">Upload multiple</button></div></div><div id="alert"></div><div class="table-wrap"><table class="admin-table"><thead><tr><th>Image</th><th>Title</th><th>Created</th><th>Actions</th></tr></thead><tbody id="tbody"></tbody></table></div></div><div class="modal" id="modal" hidden><div class="modal__backdrop" data-close></div><div class="modal__panel"><h3 id="modal-title">Upload</h3><form id="form"><input type="hidden" id="mode" value="single"><input type="hidden" id="item-id"><div class="form-group" style="margin-bottom:12px;"><label>Title (optional)</label><input id="title"></div><div class="form-group" style="margin-bottom:12px;" id="single-wrap"><label>Image</label><input type="file" id="image" accept="image/jpeg,image/png,image/webp,.jpg,.jpeg,.png,.webp"></div><div class="form-group" style="margin-bottom:12px;" id="multi-wrap" hidden><label>Images</label><input type="file" id="images" accept="image/jpeg,image/png,image/webp,.jpg,.jpeg,.png,.webp" multiple></div><div class="actions"><button type="button" class="btn btn-ghost" data-close>Cancel</button><button type="submit" class="btn btn-primary">Upload</button></div></form></div></div><script>
    (async function () {
      const A = window.FMAdmin;
      if (!A.requireAuth()) return;
      const tbody = document.getElementById('tbody');
      const modal = document.getElementById('modal');
      const form = document.getElementById('form');
      const alertBox = document.getElementById('alert');
      const show = (m, ok) => alertBox.innerHTML = `<div class="alert ${ok?'alert-success':'alert-error'}">${A.esc(m)}</div>`;

      async function load() {
        const rows = (await A.api('/api/gallery')).data || [];
        tbody.innerHTML = rows.map((g) => `
          <tr>
            <td><img class="thumb" src="${A.mediaUrl(g.imagePath)}" alt="" /></td>
            <td>${A.esc(g.title || '—')}</td>
            <td>${A.formatDate(g.createdDate)}</td>
            <td class="actions">
              <button class="btn btn-ghost btn-sm" data-edit="${g.id}">Update</button>
              <button class="btn btn-danger btn-sm" data-del="${g.id}">Delete</button>
            </td>
          </tr>`).join('') || '<tr><td colspan="4">No gallery images yet</td></tr>';
      }

      function openModal(mode, item) {
        form.reset();
        document.getElementById('mode').value = mode;
        document.getElementById('item-id').value = item?.id || '';
        document.getElementById('title').value = item?.title || '';
        document.getElementById('single-wrap').hidden = mode === 'multi';
        document.getElementById('multi-wrap').hidden = mode !== 'multi';
        document.getElementById('modal-title').textContent =
          mode === 'edit' ? 'Update image' : mode === 'multi' ? 'Upload multiple photos' : 'Upload single photo';
        document.getElementById('image').required = mode === 'single';
        document.getElementById('images').required = mode === 'multi';
        modal.hidden = false;
      }

      document.getElementById('btn-single').onclick = () => openModal('single');
      document.getElementById('btn-multi').onclick = () => openModal('multi');
      modal.querySelectorAll('[data-close]').forEach((el)=>el.onclick=()=>modal.hidden=true);

      tbody.addEventListener('click', async (e) => {
        const t=e.target;
        try {
          if (t.dataset.edit) {
            const item=(await A.api(`/api/gallery/${t.dataset.edit}`)).data;
            openModal('edit', item);
            document.getElementById('mode').value='edit';
            document.getElementById('single-wrap').hidden=false;
            document.getElementById('multi-wrap').hidden=true;
            document.getElementById('image').required=false;
          }
          if (t.dataset.del) {
            if (!confirm('Delete image?')) return;
            await A.api(`/api/gallery/${t.dataset.del}`, { method:'DELETE' });
            show('Image deleted', true); load();
          }
        } catch (ex) { show(ex.message,false); }
      });

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const mode=document.getElementById('mode').value;
        const id=document.getElementById('item-id').value;
        const title=document.getElementById('title').value;
        try {
          if (mode === 'multi') {
            const fd=new FormData();
            if (title) fd.append('title', title);
            Array.from(document.getElementById('images').files).forEach((f)=>fd.append('images', f));
            await A.api('/api/gallery/multiple', { method:'POST', body:fd });
            show('Images uploaded', true);
          } else if (mode === 'edit') {
            const fd=new FormData();
            if (title) fd.append('title', title);
            const file=document.getElementById('image').files[0];
            if (file) fd.append('image', file);
            await A.api(`/api/gallery/${id}`, { method:'PUT', body:fd });
            show('Image updated', true);
          } else {
            const fd=new FormData();
            if (title) fd.append('title', title);
            fd.append('image', document.getElementById('image').files[0]);
            await A.api('/api/gallery/single', { method:'POST', body:fd });
            show('Image uploaded', true);
          }
          modal.hidden=true; load();
        } catch (ex) { show(ex.message,false); }
      });

      await load();
    })();
  </script></div></div></div><script>
      (function () {
        if (!window.FMAdmin.requireAuth()) return;
        const user = window.FMAdmin.getUser();
        const label = document.getElementById('admin-user-label');
        if (label && user) label.textContent = user.fullName + ' · ' + user.role;
        document.getElementById('admin-logout')?.addEventListener('click', () => window.FMAdmin.logout());
      })();
    </script></body></html>
