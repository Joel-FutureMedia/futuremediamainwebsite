<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Vacancies | Future Media Admin</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet"><link rel="icon" type="image/png" href="/assets/logo.png"><script>(function(){const apiBase = "https://futurem.simplyfound.com.na";

      window.__API_BASE__ = apiBase;
    })();</script><script src="/admin/fm-admin.js"></script><link rel="stylesheet" href="/_astro/admin.DF6XE_WY.css"></head><body class="admin-body"><div class="admin-shell"><aside class="admin-sidebar"><div class="admin-sidebar__brand"><img src="/assets/logo.png" alt="Future Media"><span>Admin Panel</span></div><nav class="admin-nav"><a href="/admin/dashboard" class>Dashboard</a><a href="/admin/users" class>Users</a><a href="/admin/news" class>News</a><a href="/admin/events" class>Events</a><a href="/admin/gallery" class>Gallery</a><a href="/admin/vacancies" class="active">Vacancies</a><a href="/admin/applications" class>Applications</a><a href="/admin/contact" class>Contact Us</a><a href="/admin/subscriptions" class>Subscriptions</a><a href="/admin/banners" class>Banners</a></nav><div class="admin-sidebar__footer"><a href="/" style="color:rgba(255,255,255,0.7);text-decoration:none;">← View website</a></div></aside><div class="admin-main"><header class="admin-topbar"><h1>Vacancies</h1><div class="admin-user"><span id="admin-user-label">Loading…</span><button type="button" class="btn btn-ghost btn-sm" id="admin-logout">Logout</button></div></header><div class="admin-content"><div class="admin-card"><div class="admin-card__header"><h2>Job vacancies</h2><button type="button" class="btn btn-primary" id="btn-add">Post vacancy</button></div><div id="alert"></div><div class="table-wrap"><table class="admin-table"><thead><tr><th>Media</th><th>Title</th><th>Closing</th><th>Published</th><th>Actions</th></tr></thead><tbody id="tbody"></tbody></table></div></div><div class="modal" id="modal" hidden><div class="modal__backdrop" data-close></div><div class="modal__panel"><h3 id="modal-title">Post vacancy</h3><form id="form"><input type="hidden" id="item-id"><div class="form-group" style="margin-bottom:12px;"><label>Title</label><input id="title" required></div><div class="form-group" style="margin-bottom:12px;"><label>Description</label><textarea id="desc" required></textarea></div><div class="form-grid"><div class="form-group"><label>Closing date</label><input type="date" id="closing"></div><div class="form-group"><label>Published</label><select id="published"><option value="true">Yes</option><option value="false">No</option></select></div></div><div class="form-group" style="margin:12px 0;"><label>Image or PDF</label><input type="file" id="media" accept="image/jpeg,image/png,image/webp,application/pdf,.jpg,.jpeg,.png,.webp,.pdf"></div><div class="actions"><button type="button" class="btn btn-ghost" data-close>Cancel</button><button type="submit" class="btn btn-primary">Save</button></div></form></div></div><script>
    (async function () {
      const A = window.FMAdmin;
      if (!A.requireAuth()) return;
      const tbody = document.getElementById('tbody');
      const modal = document.getElementById('modal');
      const form = document.getElementById('form');
      const alertBox = document.getElementById('alert');
      const show = (m, ok) => alertBox.innerHTML = `<div class="alert ${ok?'alert-success':'alert-error'}">${A.esc(m)}</div>`;

      async function load() {
        const rows = (await A.api('/api/vacancies')).data || [];
        tbody.innerHTML = rows.map((v) => `
          <tr>
            <td>${v.mediaType==='IMAGE'?`<img class="thumb" src="${A.mediaUrl(v.mediaPath)}" alt=""/>`:`<a href="${A.mediaUrl(v.mediaPath)}" target="_blank">${A.esc(v.mediaType)}</a>`}</td>
            <td>${A.esc(v.title)}</td>
            <td>${v.closingDate || '—'}</td>
            <td>${v.published ? 'Yes' : 'No'}</td>
            <td class="actions">
              <button class="btn btn-ghost btn-sm" data-edit="${v.id}">Edit</button>
              <button class="btn btn-ghost btn-sm" data-pub="${v.id}" data-on="${v.published}">${v.published?'Unpublish':'Publish'}</button>
              <button class="btn btn-danger btn-sm" data-del="${v.id}">Delete</button>
            </td>
          </tr>`).join('') || '<tr><td colspan="5">No vacancies yet</td></tr>';
      }

      document.getElementById('btn-add').onclick = () => {
        form.reset(); document.getElementById('item-id').value='';
        document.getElementById('modal-title').textContent='Post vacancy';
        document.getElementById('media').required=true; modal.hidden=false;
      };
      modal.querySelectorAll('[data-close]').forEach((el)=>el.onclick=()=>modal.hidden=true);

      tbody.addEventListener('click', async (e) => {
        const t=e.target;
        try {
          if (t.dataset.edit) {
            const item=(await A.api(`/api/vacancies/${t.dataset.edit}`)).data;
            document.getElementById('item-id').value=item.id;
            document.getElementById('title').value=item.title;
            document.getElementById('desc').value=item.description;
            document.getElementById('closing').value=item.closingDate||'';
            document.getElementById('published').value=String(item.published);
            document.getElementById('media').required=false;
            document.getElementById('modal-title').textContent='Update vacancy';
            modal.hidden=false;
          }
          if (t.dataset.pub) {
            const on = t.dataset.on === 'true';
            await A.api(`/api/vacancies/${t.dataset.pub}/${on?'unpublish':'publish'}`, { method:'PUT' });
            show(on?'Unpublished':'Published', true); load();
          }
          if (t.dataset.del) {
            if (!confirm('Delete vacancy?')) return;
            await A.api(`/api/vacancies/${t.dataset.del}`, { method:'DELETE' });
            show('Vacancy deleted', true); load();
          }
        } catch (ex) { show(ex.message,false); }
      });

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const id=document.getElementById('item-id').value;
        const fd=new FormData();
        fd.append('title', document.getElementById('title').value);
        fd.append('description', document.getElementById('desc').value);
        const closing=document.getElementById('closing').value;
        if (closing) fd.append('closingDate', closing);
        fd.append('published', document.getElementById('published').value);
        const file=document.getElementById('media').files[0];
        if (file) fd.append('media', file);
        try {
          if (id) await A.api(`/api/vacancies/${id}`, { method:'PUT', body:fd });
          else await A.api('/api/vacancies', { method:'POST', body:fd });
          show(id?'Vacancy updated':'Vacancy created', true); modal.hidden=true; load();
        } catch (ex) { show(ex.message,false); }
      });

      await load();
    })();
  </script></div></div></div><script>
      (function () {
        if (!window.FMAdmin.requireAuth()) return;
        const user = window.FMAdmin.getUser();
        const label = document.getElementById('admin-user-label');
        if (label && user) label.textContent = user.fullName + ' · ' + user.role;
        document.getElementById('admin-logout')?.addEventListener('click', () => window.FMAdmin.logout());
      })();
    </script></body></html>
